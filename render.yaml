services:
  - type: web
    name: uma-finance
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/darshanbachhav0/finance-main.git
    branch: codex/management-api-portal
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DRAFT_ENCRYPTION_KEY
        generateValue: true
      - key: UMA_STORAGE_ROOT
        value: /tmp/uma-finance
      - key: SUNAT_PROVIDER_MODE
        value: MANUAL
      - key: MANAGEMENT_API_CACHE_SECONDS
        value: 15
      - key: MANAGEMENT_API_RATE_LIMIT
        value: 240
      - key: CLIENT_URLS
        sync: false
      - key: BANK_FILE_MODE
        value: DEMO
      - key: BATCH_INVOICE_INLINE_PROCESSING
        value: "false"
