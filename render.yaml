# Production layout: ONE web service. Render persistent disks cannot be shared between services,
# so everything that touches files (uploaded evidence read by the A2 batch-invoice worker, the
# SUNAT Padron dataset) runs inside this service, next to its disk. The batch-invoice worker,
# the SLA escalation worker and the Padron refresh are started in-process by backend/server.js;
# each can be switched off with its *_WORKER_ENABLED flag below. See docs/OPERATIONS.md section 4.
# Keep a single instance (no horizontal scaling): the disk can only attach to one instance.
services:
  - type: web
    name: uma-finance
    runtime: node
    plan: 0.5c-512mb
    repo: https://github.com/darshanbachhav0/finance-main.git
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: uma-finance-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DRAFT_ENCRYPTION_KEY
        generateValue: true
      # Encrypts the Super Admin authenticator secrets. If a Super Admin set up their authenticator
      # before this key existed, run `npm run superadmin:reset-2fa -- --dni=<DNI>` once.
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      - key: UMA_STORAGE_ROOT
        value: /var/data
      # Backups (npm run backup and the Super Admin console) on the persistent disk.
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: SUNAT_PADRON_DATA_DIR
        value: /var/data/sunat-padron
      - key: SUNAT_PROVIDER_MODE
        value: PADRON
      # Without a contracted SUNAT exchange-rate API, USD requests use the daily rate Accounting
      # enters in Exchange rates (recorded as a reference fallback, never as authoritative).
      - key: EXCHANGE_RATE_ALLOW_REFERENCE_FALLBACK
        value: "true"
      # SIRE / RCE export (Accounting > SIRE). UMA's RUC and legal name exactly as registered with
      # SUNAT (Padron: ACTIVO / HABIDO). DNG = UMA's purchases go to Anexo 11 columns 19/20,
      # confirmed by UMA's accounting.
      - key: SIRE_TAXPAYER_RUC
        value: "20550807123"
      - key: SIRE_TAXPAYER_NAME
        value: UNIVERSIDAD MARIA AUXILIADORA S.A.C.
      - key: SIRE_RCE_IGV_DESTINATION
        value: DNG
      - key: SIRE_RCE_BOOK_CURRENCY
        value: PEN
      - key: MANAGEMENT_API_CACHE_SECONDS
        value: 15
      - key: MANAGEMENT_API_RATE_LIMIT
        value: 240
      - key: CLIENT_URLS
        sync: false
      - key: BANK_FILE_MODE
        value: PRODUCTION
      - key: BATCH_INVOICE_INLINE_PROCESSING
        value: "false"
      # In-process background workers (backend/src/workers/inProcessWorkers.js).
      - key: BATCH_INVOICE_WORKER_ENABLED
        value: "true"
      - key: BATCH_INVOICE_POLL_MS
        value: 5000
      - key: BATCH_INVOICE_STALE_MINUTES
        value: 15
      - key: BATCH_INVOICE_WORKER_CONCURRENCY
        value: 3
      - key: SLA_WORKER_ENABLED
        value: "true"
      - key: SLA_DUE_SOON_HOURS
        value: 4
      - key: SLA_ESCALATION_WORKING_DAYS
        value: 1
      - key: SLA_POLL_MS
        value: 60000
      - key: SUNAT_PADRON_WORKER_ENABLED
        value: "true"
      # Notification emails (docs/OPERATIONS.md §4). Nothing is sent until the SMTP_* values and
      # NOTIFICATION_EMAIL_FROM are filled in; an incomplete setup is reported in the boot log.
      - key: NOTIFICATION_EMAIL_MODE
        value: SMTP
      - key: NOTIFICATION_EMAIL_WORKER_ENABLED
        value: "true"
      - key: APP_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      # 0 = email as soon as the notification is created.
      - key: NOTIFICATION_EMAIL_DELAY_MINUTES
        value: 0

